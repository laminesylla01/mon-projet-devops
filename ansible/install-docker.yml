- name: Installer Docker
  hosts: all
  tasks:

    - name: Mettre à jour la liste des paquets
      apt:
        update_cache: yes

    - name: Installer Docker
      apt:
        name: docker.io
        state: present

    - name: Démarrer Docker et l'activer au boot
      service:
        name: docker
        state: started
        enabled: yes
