# Liste des machines du homelab affichées sur le tableau de bord.
# Pour ajouter une machine : copier un bloc, l'adapter, puis git push.
#
#   nom    : nom affiché
#   role   : petite description
#   groupe : catégorie (les tuiles sont regroupées par groupe)
#   hote   : adresse IP
#   port   : port testé (22 = SSH, 8006 = Proxmox, 1521 = Oracle...)
#   lien   : (facultatif) adresse ouverte au clic sur la tuile

# ---------- Infrastructure ----------
